<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEshop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0c101c"/>
      <stop offset="100%" stop-color="#151b2e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.6)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.75)"/>
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="url(#bgEshop)"/>

  <!-- Background Grids & Light Blobs -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="900" y1="0" x2="900" y2="750"/>
  </g>
  <circle cx="200" cy="500" r="220" fill="#8b5cf6" opacity="0.08" filter="blur(70px)"/>
  <circle cx="1000" cy="200" r="200" fill="#ec4899" opacity="0.06" filter="blur(60px)"/>

  <!-- Browser Frame -->
  <g transform="translate(60, 40)">
    <rect width="1080" height="670" rx="16" fill="#0b1120" stroke="url(#borderGrad2)" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect width="1080" height="48" rx="16" fill="#131b2e"/>
    <rect y="32" width="1080" height="16" fill="#131b2e"/>
    <line x1="0" y1="48" x2="1080" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="28" cy="24" r="6" fill="#ef4444"/>
    <circle cx="48" cy="24" r="6" fill="#eab308"/>
    <circle cx="68" cy="24" r="6" fill="#22c55e"/>

    <!-- Browser Address Bar -->
    <rect x="240" y="10" width="600" height="28" rx="8" fill="#090d16" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="260" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">🔒 https://<tspan fill="#c084fc">yash-eshopping.onrender.com</tspan></text>

    <!-- Live Badge -->
    <rect x="940" y="12" width="110" height="24" rx="12" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1"/>
    <circle cx="956" cy="24" r="3.5" fill="#c084fc"/>
    <text x="968" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#d8b4fe">LIVE DEPLOY</text>

    <!-- Navigation Bar -->
    <g transform="translate(40, 68)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="url(#purpleGrad)"/>
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">🛍️</text>
      <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="800" fill="#f8fafc">E-<tspan fill="#c084fc">Shopping</tspan></text>

      <!-- Nav Links -->
      <text x="220" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#cbd5e1" font-weight="500">Categories</text>
      <text x="320" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#64748b">Featured</text>
      <text x="400" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#64748b">New Arrivals</text>
      <text x="510" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#64748b">Order History</text>

      <!-- Search Input in Navbar -->
      <rect x="620" y="2" width="260" height="32" rx="8" fill="#070a12" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="635" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Search products &amp; items...</text>

      <!-- Cart Icon & Badge -->
      <g transform="translate(900, 2)">
        <rect x="0" y="0" width="110" height="32" rx="8" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.4)" stroke-width="1"/>
        <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">🛒</text>
        <text x="40" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Cart</text>
        <!-- Badge count -->
        <circle cx="85" cy="16" r="10" fill="#ec4899"/>
        <text x="85" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
      </g>
    </g>

    <!-- Promotional Hero Card -->
    <g transform="translate(40, 126)">
      <rect x="0" y="0" width="1000" height="150" rx="14" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <rect x="30" y="24" width="180" height="22" rx="11" fill="rgba(236,72,153,0.1)" stroke="#ec4899" stroke-width="0.8"/>
      <text x="42" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#f472b6">✦ FULL STACK E-COMMERCE</text>

      <text x="30" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Modern Online Storefront Architecture</text>
      <text x="30" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">Product catalog, database models, shopping cart state management, user authentication &amp; cloud deploy.</text>

      <!-- Stack Badges -->
      <g transform="translate(720, 24)">
        <rect x="0" y="0" width="80" height="26" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
        <text x="40" y="17" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">Python</text>

        <rect x="90" y="0" width="80" height="26" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
        <text x="130" y="17" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="middle">Django</text>

        <rect x="180" y="0" width="70" height="26" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
        <text x="215" y="17" font-family="monospace" font-size="11" fill="#facc15" text-anchor="middle">SQL</text>
      </g>
    </g>

    <!-- Categories Strip -->
    <g transform="translate(40, 292)">
      <rect x="0" y="0" width="120" height="34" rx="8" fill="#8b5cf6"/>
      <text x="60" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">All Products</text>

      <rect x="135" y="0" width="130" height="34" rx="8" fill="#131b2e" stroke="rgba(255,255,255,0.08)"/>
      <text x="200" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">💻 Electronics</text>

      <rect x="280" y="0" width="130" height="34" rx="8" fill="#131b2e" stroke="rgba(255,255,255,0.08)"/>
      <text x="345" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">🎧 Accessories</text>

      <rect x="425" y="0" width="130" height="34" rx="8" fill="#131b2e" stroke="rgba(255,255,255,0.08)"/>
      <text x="490" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">⌚ Wearables</text>
      
      <rect x="570" y="0" width="130" height="34" rx="8" fill="#131b2e" stroke="rgba(255,255,255,0.08)"/>
      <text x="635" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">📱 Smartphones</text>
    </g>

    <!-- Products Grid Mockup -->
    <g transform="translate(40, 345)">
      <!-- Product 1 -->
      <g transform="translate(0, 0)">
        <rect width="315" height="280" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <!-- Product Image Placeholder Box -->
        <rect x="15" y="15" width="285" height="130" rx="8" fill="#1e293b"/>
        <text x="157" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="40" text-anchor="middle">🎧</text>
        <rect x="25" y="25" width="60" height="20" rx="4" fill="#8b5cf6"/>
        <text x="55" y="39" font-family="monospace" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">POPULAR</text>

        <!-- Product details -->
        <text x="20" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Wireless Pro ANC Headphones</text>
        <text x="20" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">High-fidelity audio &amp; noise cancellation</text>
        <text x="20" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#00f2fe">$149.00</text>
        <text x="95" y="214" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b" text-decoration="line-through">$199.00</text>
        <rect x="20" y="235" width="275" height="34" rx="6" fill="#8b5cf6"/>
        <text x="157" y="257" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Add to Cart</text>
      </g>

      <!-- Product 2 -->
      <g transform="translate(340, 0)">
        <rect width="315" height="280" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <rect x="15" y="15" width="285" height="130" rx="8" fill="#1e293b"/>
        <text x="157" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="40" text-anchor="middle">⌚</text>
        <rect x="25" y="25" width="60" height="20" rx="4" fill="#10b981"/>
        <text x="55" y="39" font-family="monospace" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">IN STOCK</text>

        <text x="20" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Smartwatch Matrix Ultra</text>
        <text x="20" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Health metrics, GPS &amp; OLED display</text>
        <text x="20" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#00f2fe">$89.00</text>
        <text x="85" y="214" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b" text-decoration="line-through">$120.00</text>
        <rect x="20" y="235" width="275" height="34" rx="6" fill="#8b5cf6"/>
        <text x="157" y="257" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Add to Cart</text>
      </g>

      <!-- Product 3 -->
      <g transform="translate(680, 0)">
        <rect width="320" height="280" rx="12" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <rect x="15" y="15" width="290" height="130" rx="8" fill="#1e293b"/>
        <text x="160" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="40" text-anchor="middle">💻</text>
        <rect x="25" y="25" width="65" height="20" rx="4" fill="#00f2fe"/>
        <text x="57" y="39" font-family="monospace" font-size="10" font-weight="bold" fill="#0b1120" text-anchor="middle">FEATURED</text>

        <text x="20" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Mechanical Keyboard RGB</text>
        <text x="20" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Custom hot-swap switches &amp; macro dial</text>
        <text x="20" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#00f2fe">$119.00</text>
        <rect x="20" y="235" width="280" height="34" rx="6" fill="#8b5cf6"/>
        <text x="160" y="257" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Add to Cart</text>
      </g>
    </g>
  </g>
</svg>
