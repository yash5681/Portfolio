      <text x="55" y="24" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">Python</text>

      <rect x="125" y="0" width="110" height="38" rx="8" fill="#1e293b" stroke="rgba(34,197,94,0.3)"/>
      <text x="180" y="24" font-family="monospace" font-size="14" font-weight="bold" fill="#4ade80" text-anchor="middle">Django</text>

      <rect x="250" y="0" width="130" height="38" rx="8" fill="#1e293b" stroke="rgba(250,204,21,0.3)"/>
      <text x="315" y="24" font-family="monospace" font-size="14" font-weight="bold" fill="#facc15" text-anchor="middle">JavaScript</text>

      <rect x="395" y="0" width="130" height="38" rx="8" fill="#1e293b" stroke="rgba(168,85,247,0.3)"/>
      <text x="460" y="24" font-family="monospace" font-size="14" font-weight="bold" fill="#c084fc" text-anchor="middle">PostgreSQL</text>

      <rect x="540" y="0" width="110" height="38" rx="8" fill="#1e293b" stroke="rgba(56,189,248,0.3)"/>
      <text x="595" y="24" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">REST API</text>

      <rect x="665" y="0" width="100" height="38" rx="8" fill="#1e293b" stroke="rgba(244,63,94,0.3)"/>
      <text x="715" y="24" font-family="monospace" font-size="14" font-weight="bold" fill="#fb7185" text-anchor="middle">Render</text>
    </g>

    <!-- Footer Meta -->
    <g transform="translate(0, 370)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#64748b">📍 Himmatnagar, Gujarat, India</text>
      <text x="300" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#64748b">✉️ pyash7571@gmail.com</text>
      <text x="600" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#64748b">📞 +91 9023433407</text>
    </g>
